<!doctype html>
<!-- Sanitised, hand-written stand-in for m.facebook.com Marketplace (the mobile site). Same shape as the
     real page (checked logged out, Nov 2026): no item links or ids; each listing is an MContainer with an
     action id, holding a ServerImageArea labelled "<title> for sale - <condition> - <price> in <place>",
     then ServerTextArea lines (price, title cut short, place). Two cards per row. No real data. -->
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Buy and Sell in Perth | Facebook Marketplace</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .top { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #fff; border-bottom: 1px solid #ddd; }
  .feed { padding-top: 56px; }
  .row { display: flex; }
  .wrap { width: 50%; }
  .wrap .card { width: 100%; }
  .card { width: 50%; height: 240px; position: relative; }
  .ph { height: 160px; background: #ccc; }
  img { width: 100%; height: 160px; display: block; }
</style>
</head>
<body>
<div data-mcomponent="MScreen" data-type="container">
  <div class="top" data-mcomponent="MContainer" data-type="container">
    <div data-mcomponent="MContainer" data-action-id="1" data-focusable="true" aria-label="Open app"><div data-mcomponent="ServerTextArea">Open app</div></div>
    <div data-mcomponent="MContainer" data-action-id="2" data-focusable="true" aria-label="Categories"><div data-mcomponent="ServerTextArea">Categories</div></div>
  </div>
  <div class="feed" data-mcomponent="MContainer" data-type="vscroller">
    <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Today's picks</span></div></div>
    <div class="row" data-mcomponent="MContainer" data-type="container">
      <div class="card" tabindex="0" data-focusable="true" data-action-id="301" data-mcomponent="MContainer" data-type="container">
        <div data-mcomponent="MContainer"><div aria-label="Oak dining table for sale - Used - Good - A$120 in Fremantle, WA" data-mcomponent="ServerImageArea"><img src="https://m.facebook.com/fixture/301_oak_n.jpg?stp=x" alt=""></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>A$120</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Oak dining table</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Fremantle, WA</span></div></div>
      </div>
      <div class="card" tabindex="0" data-focusable="true" data-action-id="302" data-mcomponent="MContainer" data-type="container">
        <div data-mcomponent="MContainer"><div aria-label="Road bike carbon frame 56cm for sale - Used - Like New - A$800 in Joondalup, WA" data-mcomponent="ServerImageArea"><img src="https://m.facebook.com/fixture/302_bike_n.jpg?stp=x" alt=""></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>A$800</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Road bike carbon fr...</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Joondalup, WA</span></div></div>
      </div>
    </div>
    <div class="row" data-mcomponent="MContainer" data-type="container">
      <div class="card" tabindex="0" data-focusable="true" data-action-id="303" data-mcomponent="MContainer" data-type="container">
        <div data-mcomponent="MContainer"><div aria-label="Filing cabinet for sale - Used - Fair - FREE in Sydney, NSW" data-mcomponent="ServerImageArea"><img src="https://m.facebook.com/fixture/303_cab_n.jpg?stp=x" alt=""></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>FREE</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Filing cabinet</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Sydney, NSW</span></div></div>
      </div>
      <div class="card" tabindex="0" data-focusable="true" data-action-id="304" data-mcomponent="MContainer" data-type="container">
        <div data-mcomponent="MContainer"><div aria-label="WANTED: kids bike for sale - New - A$50 in Perth, WA" data-mcomponent="ServerImageArea"><img src="https://m.facebook.com/fixture/304_wanted_n.jpg?stp=x" alt=""></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>A$50</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>WANTED: kids bike</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Perth, WA</span></div></div>
      </div>
    </div>
    <div class="row" data-mcomponent="MContainer" data-type="container">
      <div class="wrap" data-mcomponent="MContainer" data-type="container"><div class="card" tabindex="0" data-focusable="true" data-action-id="305" data-mcomponent="MContainer" data-type="container">
        <div data-mcomponent="MContainer"><div aria-label="Desk lamp for sale - Used - Good - A$25 in Atlantis Downs, WA" data-mcomponent="ServerImageArea"><img src="https://m.facebook.com/fixture/305_lamp_n.jpg?stp=x" alt=""></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Price drop</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>A$25</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Desk lamp</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Atlantis Downs, WA</span></div></div>
      </div><div class="gap"></div></div>
      <div class="wrap" data-mcomponent="MContainer" data-type="container"><div class="card" tabindex="0" data-focusable="true" data-action-id="306" data-mcomponent="MContainer" data-type="container">
        <div data-mcomponent="MContainer"><div aria-label="Pot plant&#10;in a big pot for sale - New - A$15 in Victoria Park, WA" data-mcomponent="ServerImageArea"><img src="https://m.facebook.com/fixture/306_plant_n.jpg?stp=x" alt=""></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>A$15</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Pot plant</span></div></div>
        <div data-mcomponent="ServerTextArea"><div dir="auto"><span>Victoria Park, WA</span></div></div>
      </div><div class="gap"></div></div>
    </div>
  </div>
</div>
<script>
  // The real mobile site reacts to taps on the whole card. Record them, so tests can prove our own
  // buttons on a card never open the listing.
  for (const c of document.querySelectorAll('.card')) {
    for (const t of ['pointerdown', 'click']) c.addEventListener(t, () => { document.body.dataset.cardTapped = c.getAttribute('data-action-id'); });
  }
</script>
</body>
</html>
